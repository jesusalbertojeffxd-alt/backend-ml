server.port=8080
spring.application.name=alixxpres

# Conexión a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/alixxpres_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración global de CORS para React
spring.mvc.cors.allowed-origins=http://localhost:5173
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true

# Configuración de JWT Tokens
app.jwt.secret=ok5kmCH6mHTVaucbw8v7m4k4M4Wnf7xJOIT8mVT2gh8
app.jwt.expiration-ms=86400000

# API Key de Stripe (déjala en blanco, la configurarás después)
stripe.apikey.secret=