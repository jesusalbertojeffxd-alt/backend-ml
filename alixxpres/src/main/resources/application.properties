server.port=8080
spring.application.name=alixxpres

# ============================================
# CONEXIÓN A LA BASE DE DATOS
# ============================================
# Usa variables de entorno para que funcione en Coolify y localmente
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alixxpres_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# ============================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================
# CONFIGURACIÓN DE CORS PARA REACT
# ============================================
spring.mvc.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true

# ============================================
# CONFIGURACIÓN DE JWT TOKENS
# ============================================
app.jwt.secret=${JWT_SECRET:ok5kmCH6mHTVaucbw8v7m4k4M4Wnf7xJOIT8mVT2gh8}
app.jwt.expiration-ms=86400000

# ============================================
# API KEY DE STRIPE
# ============================================
stripe.apikey.secret=${STRIPE_API_KEY:}
